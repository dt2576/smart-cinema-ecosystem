spring.application.name=smart-cinema-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_cinema}
spring.datasource.username=${DB_USERNAME:smart_cinema}
spring.datasource.password=${DB_PASSWORD:smart_cinema}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
