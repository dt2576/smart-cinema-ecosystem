spring.application.name=smart-cinema-backend
# Local development only; imported as Java properties, not shell dotenv syntax.
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_cinema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

discovery.time-zone=${DISCOVERY_TIME_ZONE:Asia/Ho_Chi_Minh}

seat-hold.ttl=${SEAT_HOLD_TTL:PT10M}
seat-hold.lock-timeout=${SEAT_HOLD_LOCK_TIMEOUT:PT2S}
seat-hold.statement-timeout=${SEAT_HOLD_STATEMENT_TIMEOUT:PT5S}
seat-hold.idle-timeout=${SEAT_HOLD_IDLE_TIMEOUT:PT10S}
seat-hold.cleanup-enabled=${SEAT_HOLD_CLEANUP_ENABLED:true}
seat-hold.cleanup-delay=${SEAT_HOLD_CLEANUP_DELAY:PT30S}
seat-hold.cleanup-batch-size=${SEAT_HOLD_CLEANUP_BATCH_SIZE:100}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Provider-independent Spring Mail; Gmail defaults are development/demo only.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}
spring.mail.properties.mail.debug=false
staff.invitations.delivery-enabled=${STAFF_INVITATION_DELIVERY_ENABLED:false}
staff.invitations.delivery-delay=${STAFF_INVITATION_DELIVERY_DELAY:PT10S}
staff.invitations.activation-base-url=${STAFF_ACTIVATION_BASE_URL:}
staff.invitations.from-address=${MAIL_FROM_ADDRESS:}
staff.invitations.from-name=${MAIL_FROM_NAME:Smart Cinema}
staff.invitations.encryption-keys=${STAFF_INVITATION_ENCRYPTION_KEYS:}
staff.invitations.active-key-id=${STAFF_INVITATION_ACTIVE_KEY_ID:}
staff.invitations.max-attempts=${STAFF_INVITATION_MAX_ATTEMPTS:5}
staff.invitations.retry-initial=${STAFF_INVITATION_RETRY_INITIAL:PT30S}
staff.invitations.retry-max=${STAFF_INVITATION_RETRY_MAX:PT30M}
staff.invitations.lease=${STAFF_INVITATION_LEASE:PT5M}
staff.invitations.allow-local-smtp=${STAFF_INVITATION_ALLOW_LOCAL_SMTP:false}

# Sandbox operations remain fail-closed until real merchant evidence is recorded.
vnpay.enabled=${VNPAY_ENABLED:false}
vnpay.merchant-code=${VNPAY_MERCHANT_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.frontend-result-url=${VNPAY_FRONTEND_RESULT_URL:}
vnpay.order-type=${VNPAY_ORDER_TYPE:}
vnpay.signature-confirmed=${VNPAY_SIGNATURE_CONFIRMED:false}
vnpay.success-confirmed=${VNPAY_SUCCESS_CONFIRMED:false}
vnpay.ipn-confirmed=${VNPAY_IPN_CONFIRMED:false}
vnpay.amount-window-confirmed=${VNPAY_AMOUNT_WINDOW_CONFIRMED:false}
vnpay.reopened-url-confirmed=${VNPAY_REOPENED_URL_CONFIRMED:false}
vnpay.query-confirmed=${VNPAY_QUERY_CONFIRMED:false}
vnpay.query-signature-confirmed=${VNPAY_QUERY_SIGNATURE_CONFIRMED:false}
vnpay.terminal-confirmed=${VNPAY_TERMINAL_CONFIRMED:false}
vnpay.failed-pairs=${VNPAY_FAILED_PAIRS:}
vnpay.cancelled-pairs=${VNPAY_CANCELLED_PAIRS:}
vnpay.minimum-amount=${VNPAY_MINIMUM_AMOUNT:0}
vnpay.maximum-amount=${VNPAY_MAXIMUM_AMOUNT:0}
vnpay.minimum-window-seconds=${VNPAY_MINIMUM_WINDOW_SECONDS:0}
vnpay.system-db-url=${VNPAY_SYSTEM_DB_URL:}
vnpay.system-db-username=${VNPAY_SYSTEM_DB_USERNAME:}
vnpay.system-db-password=${VNPAY_SYSTEM_DB_PASSWORD:}
vnpay.query-delay=${VNPAY_QUERY_DELAY:PT5M}
vnpay.query-horizon=${VNPAY_QUERY_HORIZON:PT24H}
vnpay.connect-timeout=${VNPAY_CONNECT_TIMEOUT:PT3S}
vnpay.response-timeout=${VNPAY_RESPONSE_TIMEOUT:PT10S}
vnpay.query-ip=${VNPAY_QUERY_IP:127.0.0.1}

